[project]
name = "subgen"
version = "0.1.0"
description = "English subtitles from burned-in Chinese captions (Apple Vision OCR + Claude Code)"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default]",
    "opencv-python-headless",
    "numpy",
    "ocrmac",
    "pillow",
    "rapidfuzz",
    "srt",
]

[project.optional-dependencies]
asr = ["funasr", "torch", "torchaudio", "mlx-whisper", "opencc-python-reimplemented", "soundfile"]

[project.scripts]
subgen = "subgen.cli:main"
subgen-compare = "subgen.compare:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["subgen"]
